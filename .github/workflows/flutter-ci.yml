name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build Android
        run: flutter build apk --debug

  publish-unified:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Flutter app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: app_flutter

      - name: Checkout iAgents
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/iAgents
          path: iagentshub

      - name: Checkout backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/backend_fastapi
          path: backend

      - name: Checkout React frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iagentshub/frontend_react
          path: frontend

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Build Flutter Web under /app/
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          mkdir -p build-ctx
          cp -r backend/ build-ctx/backend
          cp -r frontend/ build-ctx/frontend
          cp -r app_flutter/build/web build-ctx/flutter-web
          cp iagentshub/docker/Dockerfile.unified build-ctx/Dockerfile
          cp iagentshub/docker/supervisord.conf build-ctx/supervisord.conf
          cp iagentshub/docker/entrypoint-unified.sh build-ctx/entrypoint-unified.sh

      - name: Generate build version
        id: version
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Read bundled commits
        id: shas
        run: |
          echo "backend=$(git -C backend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(git -C frontend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: build-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GAIA_VERSION=${{ steps.version.outputs.value }}
            BACKEND_COMMIT=${{ steps.shas.outputs.backend }}
            FRONTEND_COMMIT=${{ steps.shas.outputs.frontend }}
          tags: |
            ghcr.io/iagentshub/app:latest
            ghcr.io/iagentshub/app:react-${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
