name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          # La version sale del pubspec de la app, que es donde la leen tambien
          # los docker-publish de iAgents y frontend_react.
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: tool/build_web.sh

      # El bundle es tiempo hasta la primera interaccion y crece sin que nadie
      # lo note: un import sin deferred devuelve un modulo entero al bundle
      # principal y ningun test de comportamiento cambia.
      - name: Presupuesto de tamano del bundle web
        run: tool/check_web_bundle_size.sh

      - name: Build Android
        run: flutter build apk --debug

  # El aviso vivía como un paso más de `validate`, con el argumento de que un
  # job aparte gastaba otro runner para lo mismo. Dejó de ser cierto cuando el
  # aviso pasó a fallar ante un token caducado o sin permisos: `validate` es
  # **el check que el preflight de iAgents exige en verde** para meter este
  # commit en la imagen, así que una avería de la cadena de entrega tumbaba el
  # veredicto sobre el código y el preflight retrocedía al commit anterior de
  # Flutter mientras durase. Son dos preguntas distintas —¿vale el código? y
  # ¿llegó el aviso?— y necesitan dos respuestas separadas.
  #
  # El cron de iAgents está declarado horario pero GitHub lo atrasa de 3 a 8 h:
  # un cambio solo de Flutter tardaba media tarde en llegar a la imagen, y el
  # panel de Admin lo enseñaba como "App (Flutter): desactualizado".
  #
  # Sin secreto es una instalación que no participa en el aviso: anotación y
  # seguir. Con secreto y respuesta 401/403 el job falla, porque es una avería
  # real y hoy se veía igual que no tenerlo — el mismo warning amarillo dentro
  # de un job verde, que nadie mira. Este llevaba meses dando 403 en cada push
  # sin que constara en ninguna parte. El cron sigue de respaldo.
  avisar-a-iagents:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar a iAgents para reconstruir la imagen unificada
        env:
          GH_TOKEN: ${{ secrets.IAGENTS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Sin IAGENTS_DISPATCH_TOKEN: la imagen esperará al cron."
            exit 0
          fi
          if ! salida=$(gh api -X POST repos/iagentshub/iAgents/dispatches \
              -f event_type=upstream-push --silent 2>&1); then
            echo "::error::El aviso a iAgents falló con el token configurado: $salida"
            exit 1
          fi

  # La imagen unificada tiene una sola fuente de verdad: iagentshub/iAgents.
  # Ese workflow fija y verifica los SHAs de app, backend y frontend antes de
  # publicar; este repositorio ya no puede sobrescribir latest por su cuenta.
