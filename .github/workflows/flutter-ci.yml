name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          # La version sale del pubspec de la app, que es donde la leen tambien
          # los docker-publish de iAgents y frontend_react.
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: tool/build_web.sh

      # El bundle es tiempo hasta la primera interaccion y crece sin que nadie
      # lo note: un import sin deferred devuelve un modulo entero al bundle
      # principal y ningun test de comportamiento cambia.
      - name: Presupuesto de tamano del bundle web
        run: tool/check_web_bundle_size.sh

      - name: Build Android
        run: flutter build apk --debug

      # El preflight de iAgents espera igualmente a que este check "validate"
      # termine en verde, así que basta con avisar desde dentro; un job aparte
      # solo gastaría otro runner para lo mismo. Su cron
      # de respaldo está declarado horario pero GitHub lo atrasa de 3 a 7 h:
      # un cambio solo de Flutter tardaba media tarde en llegar a la imagen, y
      # el panel de Admin lo enseñaba como "App (Flutter): desactualizado".
      # continue-on-error a propósito — que falte el secreto no puede poner en
      # rojo un CI correcto, y el cron sigue de respaldo.
      - name: Avisar a iAgents para reconstruir la imagen unificada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.IAGENTS_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api -X POST repos/iagentshub/iAgents/dispatches -f event_type=upstream-push

  # La imagen unificada tiene una sola fuente de verdad: iagentshub/iAgents.
  # Ese workflow fija y verifica los SHAs de app, backend y frontend antes de
  # publicar; este repositorio ya no puede sobrescribir latest por su cuenta.
