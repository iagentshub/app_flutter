# Configuración del analizador. Se ejecuta desde el IDE y con
# `flutter analyze`; el objetivo es que quede siempre en cero avisos, para
# que el siguiente que aparezca signifique algo.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Un aviso que nadie arregla deja de ser un aviso.
    deprecated_member_use: warning
    unused_import: error
    unused_local_variable: error
  exclude:
    - build/**
    - "**/*.g.dart"

linter:
  rules:
    # Rendimiento: un const menos es un rebuild más.
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true

    # Corrección: los fallos que más cuesta ver en una revisión.
    # `cancel_subscriptions` cubre justo el StreamSubscription del SSE del
    # chat, y `use_build_context_synchronously` los métodos que hacen await
    # y después abren un diálogo.
    use_build_context_synchronously: true
    unawaited_futures: true
    cancel_subscriptions: true

    # Consistencia con el estilo que ya sigue el código.
    use_super_parameters: true
    avoid_print: true
    directives_ordering: true
